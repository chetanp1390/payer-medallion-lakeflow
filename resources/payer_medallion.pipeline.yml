resources:
  pipelines:
    payer_medallion:
      name: payer_medallion
      catalog: ${var.catalog_name}
      schema: ${var.bronze_schema_name}
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: ../src/01_bronze.py
        - file:
            path: ../src/02_silver.py
        - file:
            path: ../src/03_gold.py
      configuration:
        conf.catalog_name: ${var.catalog_name}
        conf.bronze_schema_name: ${var.bronze_schema_name}
        conf.silver_schema_name: ${var.silver_schema_name}
        conf.gold_schema_name: ${var.gold_schema_name}
