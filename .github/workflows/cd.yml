name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:              # lets you rerun a prod deploy by hand

# Prod deploys run one at a time and are never cancelled mid-deploy.
# Separate from CI, so CI runs don't cancel a queued prod deploy.
concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  prod:
    name: prod
    runs-on: ubuntu-latest
    environment: prod             # waits for your approval
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate
        run: databricks bundle validate -t prod
      - name: Deploy to prod
        run: databricks bundle deploy -t prod
      - name: Refresh data and run tests
        run: databricks bundle run payer_refresh -t prod
